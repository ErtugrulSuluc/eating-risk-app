<section class="card">
  <h2>Gunluk Veri Girisi</h2>

  <form [formGroup]="form" (ngSubmit)="submit()" class="entry-form">
    <label>Bugun kac ogun yedin?</label>
    <input type="number" formControlName="mealCount" min="0" max="8" />

    <label class="check"><input type="checkbox" formControlName="skippedMeal" /> Ogun atladim</label>
    <label class="check"><input type="checkbox" formControlName="nightEating" /> Gece yeme oldu</label>
    <label class="check"><input type="checkbox" formControlName="bingeEating" /> Tikinircasina yedim</label>
    <label class="check"><input type="checkbox" formControlName="emotionalEating" /> Ac degilken yedim</label>

    <label>Stres seviyesi (1-5)</label>
    <select formControlName="stressLevel">
      <option [ngValue]="1">1 - Cok dusuk</option>
      <option [ngValue]="2">2 - Dusuk</option>
      <option [ngValue]="3">3 - Orta</option>
      <option [ngValue]="4">4 - Yuksek</option>
      <option [ngValue]="5">5 - Cok yuksek</option>
    </select>

    <label>Ruh hali</label>
    <select formControlName="mood">
      <option value="good">Iyi</option>
      <option value="normal">Normal</option>
      <option value="bad">Kotu</option>
    </select>

    <h3>Arastirma Tabanli Ek Faktorler (XAI)</h3>

    <label>1) Kilo/sekil kaygisiyla yemeyi ne siklikla kisitlarsin?</label>
    <select formControlName="cognitiveControlConcern">
      <option [ngValue]="0">Never</option>
      <option [ngValue]="1">Seldom</option>
      <option [ngValue]="2">Sometimes</option>
      <option [ngValue]="3">Often</option>
    </select>

    <label>2) Uzgun/gergin/yalniz hissettiginde yeme istegi olur mu?</label>
    <select formControlName="affectiveEating">
      <option [ngValue]="0">Never</option>
      <option [ngValue]="1">Seldom</option>
      <option [ngValue]="2">Sometimes</option>
      <option [ngValue]="3">Often</option>
    </select>

    <label>3) Lezzet/goruntu/koku gibi uyaranlar sende yeme istegi tetikler mi?</label>
    <select formControlName="cueReactivity">
      <option [ngValue]="0">Never</option>
      <option [ngValue]="1">Seldom</option>
      <option [ngValue]="2">Sometimes</option>
      <option [ngValue]="3">Often</option>
    </select>

    <label>4) Son 28 gunde beden goruntunle ilgili rahatsizlik ne duzeydeydi?</label>
    <select formControlName="bodyImageConcern">
      <option [ngValue]="0">No days / Never</option>
      <option [ngValue]="1">1-12 days / Seldom</option>
      <option [ngValue]="2">13-27 days / Sometimes</option>
      <option [ngValue]="3">Every day / Often</option>
    </select>

    <label>5) Ac olmasan da aliskanlikla yeme durumu yasiyor musun?</label>
    <select formControlName="habitualCompulsion">
      <option [ngValue]="0">Never</option>
      <option [ngValue]="1">Seldom</option>
      <option [ngValue]="2">Sometimes</option>
      <option [ngValue]="3">Often</option>
    </select>

    <button type="submit" [disabled]="loading">{{ loading ? 'Kaydediliyor...' : 'Gonder' }}</button>
  </form>

  <p class="result" *ngIf="resultText">{{ resultText }}</p>
</section>
