<section class="panel">
  <h2>Son 7 Gun</h2>

  <div *ngIf="entries.length; else emptyTpl" class="rows">
    <article *ngFor="let entry of entries" class="row">
      <div class="meta">
        <strong>{{ entry.date | date:'shortDate' }}</strong>
        <span>{{ entry.riskLevel }} ({{ entry.riskScore }})</span>
      </div>
      <div class="bar-bg">
        <div class="bar" [style.width]="barWidth(entry.riskScore)"></div>
      </div>
    </article>

    <article class="summary">
      <h3>Alan Bazli Ozet</h3>
      <p>{{ risingDomainText }}</p>

      <div class="domain-rows" *ngIf="domainAverages.length">
        <div class="domain-row" *ngFor="let row of domainAverages">
          <div class="domain-meta">
            <span>{{ row.label }}</span>
            <strong>{{ row.avg }}/3</strong>
          </div>
          <div class="domain-bar-bg">
            <div class="domain-bar" [style.width]="domainBarWidth(row.avg)"></div>
          </div>
        </div>
      </div>
    </article>
  </div>
</section>

<ng-template #emptyTpl>
  <p>Gecmis kayit bulunamadi.</p>
</ng-template>
